# revela manifest
# ==============================================================================
#

[lib]
path = "src/_.rs"
bench = false

[package]
name = "revela"
description = "A revelation of structured knowledge."
repository = "https://github.com/andamira/revela"
documentation = "https://docs.rs/revela"
rust-version = "1.99.0" # in sync with .github/workflows/check.yml
edition = "2024"
version = "0.1.0-wip"
authors = ["José Luis Cruz <joseluis@andamira.net>"]
license = "MIT OR Apache-2.0"
categories = [] # IMPROVE
keywords = [] # IMPROVE
autoexamples = false
autobenches = false
publish = true
include = [
	"/Cargo.toml",
	## source code
	"/src/**/*.rs", "/src/**/*.md",
	## documentation
	"/LICENSE*",
]

[package.metadata.docs.rs]
# ------------------------------------------------------------------------------
no-default-features = true
features = ["_docs"]


[features] # 13/300 (287 remaining), 8 visible, 5 hidden
# ==============================================================================

#* Development features *#
# ------------------------------------------------------------------------------

__dbg = [] # shows extra debugging information

# enabled when publishing to crates.io or building online docs (see /src/code/util/_doclink!)
__publish = ["devela/__publish"]

__docs_internal = [] # enables documentation for internal items


#* Environment features *#
# ------------------------------------------------------------------------------

alloc = [ # enables `alloc` functionality
	"devela/alloc",
]
std = [ # disables `no_std` compatibility and enables `std` functionality
	"alloc",
	"devela/std",
]
no_std = [ # enables functionality incompatible with or substitute of `std`
	"devela/no_std",
]


#* Module features *#
# ------------------------------------------------------------------------------

all = [ # enables all the modules and submodules
]


#* Safety features *#
# ------------------------------------------------------------------------------

safest = [ "safe", "devela/safe" ] # forbids unsafe recursively
safe = [] # forbids unsafe at the crate level
unsafe = [] # enables all `unsafe` (as long as it isn't forbidden in that module)
unsafest = [ "unsafe", "devela/unsafe" ] # enables unsafe recursively


#* Scope features *#
# ------------------------------------------------------------------------------
# These features are prefixed with an underscore (_) and therefore semi-hidden.

# default = []

# The most complete versions of the documentation:
_docs_min = ["std", "unsafe"]
_docs = ["_docs_min"]


[dependencies] # 1
# ==============================================================================

[dependencies.devela]
version = "0.30.0"
# path = "../devela"
default-features = false


[badges]
maintenance = { status = "experimental" }

[lints]
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [ # Allowed configuration flags:
	"cfg(nightly)", # [12] (in sync with build/main/features.rs::FLAGS_NIGHTLY & src/_.rs)
		# Unstable nightly features without clear stabilization timeline
		"cfg(nightly_unstable)",
			# WAIT: [doc_cfg](https://github.com/rust-lang/rust/issues/43781)
			# LINK: https://github.com/rust-lang/rfcs/blob/master/text/3631-rustdoc-cfgs-handling.md
			# WAIT: [doc_notable_trait](https://github.com/rust-lang/rust/issues/45040)
			"cfg(nightly_doc)",
]

# profiles

# binaries

# examples
